<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  body { width: 560px; margin: 0; font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #17191c; color: #e6e6e6; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
           border-bottom: 1px solid #2a2d31; position: sticky; top: 0; background: #17191c; z-index: 3; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .brand { display: flex; flex-direction: column; line-height: 1.2; }
  .byline { font-size: 11px; font-style: italic; color: #7d8590; }
  #state { margin-left: auto; font-size: 12px; color: #8b949e; }
  #state.ok { color: #3fb950; }
  #state.warn { color: #d29922; }
  #state.bad { color: #f85149; }
  #gear { background: #2d333b; border: 0; color: #e6e6e6; border-radius: 5px; cursor: pointer;
          font-size: 12px; padding: 4px 10px; }

  .settings { padding: 12px; border-bottom: 1px solid #2a2d31; background: #1b1e22;
              display: flex; flex-direction: column; gap: 10px; }
  .settings[hidden] { display: none; }
  .settings label { font-size: 12px; color: #8b949e; }
  .settings .line { display: flex; gap: 8px; align-items: center; }
  /* display:flex 会盖掉 [hidden]，必须显式处理，否则切换后端时输入框不隐藏 */
  .settings .line[hidden] { display: none; }
  /* 后端的下级配置：缩进 + 左侧竖线，视觉上从属于「下载后端」 */
  /* 输入框 + 右侧内嵌图标按钮：图标浮在输入框内部，宽度与上一行保持一致 */
  .settings .line.field { position: relative; }
  .settings .line.field input { padding-right: 34px; }
  .icon-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
              background: transparent; border: 0; color: #8b949e; font-size: 14px;
              line-height: 1; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
  .icon-btn:hover { color: #e6e6e6; background: #21262d; }
  /* 保存反馈：只有 ⚙ 符号本体变亮发光，闪两下；按钮不缩放、不变色块。
     不碰 transform，避免覆盖 .icon-btn 的垂直居中。 */
  @keyframes icon-flash {
    0%, 100% { color: #8b949e; text-shadow: none; }
    20%, 60% { color: #ffffff;
               text-shadow: 0 0 6px rgba(255,255,255,.95), 0 0 12px rgba(255,255,255,.7); }
    40%, 80% { color: #8b949e; text-shadow: none; }
  }
  .icon-btn.saved { animation: icon-flash 0.9s ease-in-out 1; }
  /* 后端的下级配置：缩进 + 左侧竖线，视觉上从属于「下载后端」 */
  .sub-block { display: flex; flex-direction: column; gap: 4px;
               margin-left: 6px; padding-left: 10px; border-left: 2px solid #30363d; }
  .sub-block[hidden] { display: none; }
  /* 两行输入框必须同宽：不要一个吃默认宽度、另一个被 flex 拉满 */
  .sub-block .line { width: 260px; max-width: 100%; }
  /* border-box 关键：令牌框的 padding-right(34px，给图标留位) 默认会计入额外宽度，
     不改成 border-box 就会比地址框宽 34px */
  .sub-block .line input { width: 100%; flex: 0 0 auto; box-sizing: border-box; }
  .settings input[type="password"] { flex: 1 1 auto; background: #0d1117; border: 1px solid #30363d;
              color: #e6e6e6; padding: 5px 8px; border-radius: 5px; font-size: 12px; }
  .settings .check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #c9d1d9; }
  .mark { font-weight: 700; }
  .mark.good { color: #3fb950; }
  .mark.bad { color: #f85149; }
  .mark.warn { color: #d29922; }

  #list { max-height: 440px; overflow-y: auto; }
  .row { padding: 8px 12px; border-bottom: 1px solid #212429; display: flex; gap: 10px; align-items: center; }
  .row:hover { background: #1d2024; }
  .item.open .row { background: #1d2024; border-bottom-color: transparent; }
  .details { padding: 4px 12px 12px 12px; background: #1b1e22; border-bottom: 1px solid #2a2d31; }
  .detail-line { display: flex; gap: 8px; font-size: 12px; line-height: 1.7; }
  .detail-key { flex: 0 0 48px; color: #8b949e; }
  .detail-val { flex: 1 1 auto; word-break: break-all; }
  .detail-url { margin: 6px 0; padding: 6px 8px; background: #0d1117; border: 1px solid #21262d;
                border-radius: 4px; font-size: 11px; color: #79c0ff; word-break: break-all;
                max-height: 52px; overflow-y: auto; }
  .preview { width: 100%; margin-top: 8px; border-radius: 6px; background: #000; max-height: 220px; }
  .detail-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .hint { font-size: 11px; color: #6e7681; }
  .kind { flex: 0 0 52px; text-align: center; font-size: 11px; padding: 2px 0; border-radius: 4px;
          background: #23303a; color: #79c0ff; }
  .kind.stream { background: #3a2a1a; color: #f0a14e; }
  .kind.blob { background: #33203a; color: #d2a8ff; }
  .meta { flex: 1 1 auto; min-width: 0; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: #8b949e; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-badge { display: inline-block; font-size: 10px; color: #8b949e; border: 1px solid #30363d;
               border-radius: 3px; padding: 0 4px; margin-left: 4px; max-width: 160px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
  button { background: #238636; border: 0; color: #fff; padding: 5px 10px; border-radius: 5px;
           cursor: pointer; font-size: 12px; }
  button.ghost { background: #2d333b; }
  button.err { background: #b62324; }
  button.err:hover { background: #cf2b2d; }
  button:disabled { background: #2d333b; color: #6e7681; cursor: default; }
  .empty { padding: 30px 12px; text-align: center; color: #6e7681; }
  .banner { padding: 8px 12px; font-size: 12px; background: #4a1d1d; color: #ffb4b4;
            border-bottom: 1px solid #6b2b2b; }

  /* ---- 底栏与功能面板 ---- */
  .panel { padding: 8px 12px; border-top: 1px solid #2a2d31; background: #1b1e22;
           display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; }
  .panel[hidden] { display: none; }
  .panel input[type="text"] { flex: 1 1 140px; background: #0d1117; border: 1px solid #30363d;
           color: #e6e6e6; padding: 4px 8px; border-radius: 5px; font-size: 12px; }
  .panel select { background: #0d1117; border: 1px solid #30363d; color: #e6e6e6;
           padding: 4px; border-radius: 5px; font-size: 12px; }
  .bar { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid #2a2d31;
         position: sticky; bottom: 0; background: #17191c; flex-wrap: wrap; }
  .bar button { background: #2d333b; padding: 4px 9px; }
  .bar button.active { background: #238636; }
  .bar .spacer { flex: 1 1 auto; }
  .bar button.split { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; }
  .bar .icon { border-left: 1px solid rgba(255,255,255,.22); padding-left: 6px; line-height: 1; }
  .bar .icon:hover { color: #fff; }
  /* 播放器的暂停/播放图标，用 CSS 画，避免字体差异 */
  .pp-icon { width: 12px; height: 12px; display: inline-block; position: relative; }
  .pp-icon::before, .pp-icon::after {
    content: ""; position: absolute; top: 0; width: 4px; height: 12px;
    background: currentColor; border-radius: 1px;
  }
  .pp-icon::before { left: 1px; }
  .pp-icon::after { left: 7px; }
  #btn-pause.paused .pp-icon::before {
    left: 3px; top: 0; width: 0; height: 0; background: transparent;
    border-left: 9px solid currentColor;
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
    border-radius: 0;
  }
  #btn-pause.paused .pp-icon::after { display: none; }
  #btn-pause.paused { background: #238636; }
  .group-head { padding: 6px 12px; font-size: 11px; color: #8b949e; background: #141619;
                border-bottom: 1px solid #212429; cursor: pointer; display: flex;
                align-items: center; gap: 6px; user-select: none; }
  .group-head:hover { background: #191c20; }
  .caret { width: 12px; display: inline-block; }
  .type-filters { flex: 1 1 100%; display: flex; gap: 12px; flex-wrap: wrap; }
  .type-filters label { display: flex; align-items: center; gap: 4px; color: #c9d1d9; }
  .backup { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .backup-sub { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
                margin-left: 6px; padding-left: 10px; border-left: 2px solid #30363d; }
  .backup-sub[hidden] { display: none; }
  button.sub { background: transparent; color: #79c0ff; padding: 1px 0; font-size: 12px; }
  button.sub:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>OpenDL Catcher</h1>
    <span class="byline">by Thiry</span>
  </div>
  <button id="gear" title="设置">设置</button>
  <span id="state">检查中…</span>
</header>

<div id="settings" class="settings" hidden>
  <label for="backend">下载后端</label>
  <select id="backend">
    <option value="gopeed">Gopeed</option>
    <option value="opendl">OpenDL</option>
  </select>
  <div id="gopeed-fields" class="sub-block" hidden>
    <label for="gopeed-url">监听地址</label>
    <div class="line">
      <input id="gopeed-url" type="text" placeholder="http://127.0.0.1:9999" />
    </div>
    <label for="gopeed-token">接口令牌 <span id="gopeed-mark" class="mark"></span></label>
    <div class="line field">
      <input id="gopeed-token" type="password" placeholder="未设置可留空" />
      <button id="gopeed-save" class="icon-btn" title="保存">⚙</button>
    </div>
  </div>
  <div id="pair-block" class="sub-block" hidden>
    <label for="token">配对码 <span id="pair-mark" class="mark"></span></label>
    <div class="line field">
      <input id="token" type="password" placeholder="粘贴完整配对码" />
      <button id="save" class="icon-btn" title="保存">⚙</button>
    </div>
  </div>
  <label class="check"><input id="takeover" type="checkbox" /> 接管浏览器下载</label>
  <div class="backup">
    <button id="btn-backup" class="ghost"><span id="backup-caret">▸</span> 备份</button>
    <div id="backup-menu" class="backup-sub" hidden>
      <button id="btn-export" class="sub">导出</button>
      <button id="btn-import" class="sub">导入</button>
      <span id="backup-tip" class="hint"></span>
      <input id="file-import" type="file" accept="application/json,.json" hidden />
    </div>
  </div>
</div>

<div id="banner" class="banner" hidden></div>

<div id="list"><div class="empty">当前页面还没有捕获到媒体</div></div>

<!-- [功能3] 条件选择面板 -->
<div id="panel-select" class="panel" hidden>
  <button id="sel-all" class="ghost">全选</button>
  <button id="sel-invert" class="ghost">反选</button>
  <button id="sel-clear" class="ghost">清空</button>
  <input id="filter" type="text" placeholder="筛选：URL 正则，回车生效" />
  <button id="filter-apply" class="ghost">应用</button>
  <div id="type-filters" class="type-filters"></div>
</div>

<!-- [功能6] 媒体控制面板 -->
<div id="panel-media" class="panel" hidden>
  <button id="media-toggle" class="ghost">播放/暂停</button>
  <button id="media-mute" class="ghost">静音</button>
  <select id="media-rate">
    <option value="0.5">0.5×</option>
    <option value="1" selected>1.0×</option>
    <option value="1.25">1.25×</option>
    <option value="1.5">1.5×</option>
    <option value="2">2.0×</option>
  </select>
  <button id="media-pip" class="ghost">画中画</button>
  <button id="media-full" class="ghost">全屏</button>
</div>

<!-- 底栏：每个按钮对应一个功能块，去掉功能时删按钮 + 对应代码块 -->
<footer class="bar">
  <button id="btn-pause" class="split">
    <span id="pause-icon" class="pp-icon"></span>
    <span id="pause-label">嗅探</span>
    <span id="btn-refresh" class="icon">⟳</span>
  </button>
  <button id="btn-select">条件选择</button>
  <button id="btn-batch">批量下载</button> <span id="batch-count" class="hint"></span>
  <button id="btn-aggregate">页面聚合</button>
  <button id="btn-media">媒体控制</button>
</footer>

<script src="popup.js"></script>
</body>
</html>
